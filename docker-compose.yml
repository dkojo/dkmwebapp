services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dkm
      MYSQL_USER: dkm
      MYSQL_PASSWORD: dkm
      MYSQL_ROOT_PASSWORD: root-local-only
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  api:
    build: ./app
    environment:
      DB_HOST: db
      APP_VERSION: local
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
