apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-and-limits
spec:
  rules:
    - name: cpu-memory-requests-memory-limit
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [dkm]
      validate:
        failureAction: Audit
        message: "Containers need cpu and memory requests, and a memory limit, so Karpenter can size nodes."
        pattern:
          spec:
            containers:
              - resources:
                  requests: { cpu: "?*", memory: "?*" }
                  limits: { memory: "?*" }
