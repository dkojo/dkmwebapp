{{- if .Values.metrics.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dkmwebapp
spec:
  selector: { matchLabels: { app: dkmwebapp } }   # matches the stable and (Phase 10) canary Services
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
{{- end }}
