{{- if not .Values.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dkmwebapp
spec:
  selector: { matchLabels: { app: dkmwebapp } }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    {{- include "dkmwebapp.podTemplate" . | nindent 4 }}
{{- end }}
